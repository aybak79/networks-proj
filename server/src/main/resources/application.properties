# Network: listen on ALL interfaces so phones can reach the laptop
server.port=8080
server.address=0.0.0.0

# Database (file-based so data survives restarts)
spring.datasource.url=jdbc:h2:file:./data/chatdb2
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true

# Metrics
management.endpoints.web.exposure.include=health,metrics

app.jwt.secret=change-this-to-a-long-random-string-at-least-32-chars
app.jwt.expiration-ms=86400000